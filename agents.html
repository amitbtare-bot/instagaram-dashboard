<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#08081A;--panel:#0E0E24;--panel-border:#1A1A3A;
  --text:#E0E0F0;--text2:#8888AA;--text3:#555577;
  --flame:#E85A2A;--flame-dim:#E85A2A30;
  --cmd:#E85A2A;--creative:#A66CFF;--production:#4AE88A;

}
html,body{

  height:100%;overflow:hidden;-webkit-font-smoothing:antialiased;
}
canvas{display:block;width:100%;height:100%;cursor:grab}
canvas:active{cursor:grabbing}
canvas.hovering{cursor:pointer}

/* Detail Panel */
.panel{
  position:fixed;right:-420px;top:0;bottom:0;width:400px;max-width:85vw;
  background:var(--panel);border-left:1px solid var(--panel-border);
  z-index:100;transition:right .35s cubic-bezier(.4,0,.2,1);
  overflow-y:auto;padding:0;
  box-shadow:-20px 0 60px rgba(0,0,0,.5);
}
.panel.open{right:0}
.panel-header{
  padding:1.5rem 1.5rem 1rem;position:sticky;top:0;
  background:var(--panel);z-index:1;
  border-bottom:1px solid var(--panel-border);
}
.panel-close{
  position:absolute;top:1rem;right:1rem;width:32px;height:32px;
  border:1px solid var(--panel-border);border-radius:6px;background:transparent;
  color:var(--text2);cursor:pointer;font-size:1.1rem;display:flex;
  align-items:center;justify-content:center;transition:all .15s;
}
.panel-close:hover{background:var(--panel-border);color:var(--text)}
.panel-emoji{font-size:2.2rem;margin-bottom:.5rem}
.panel-name{font-size:1.4rem;font-weight:800;letter-spacing:-.02em}
.panel-role{font-size:.8rem;color:var(--text2);margin-top:.15rem;font-weight:500}
.dept-badge{
  display:inline-block;font-size:.55rem;font-weight:700;text-transform:uppercase;
  letter-spacing:.08em;padding:.2rem .6rem;border-radius:3px;margin-top:.5rem;
}
.panel-body{padding:1.5rem}
.section-title{
  font-size:.6rem;font-weight:700;text-transform:uppercase;
  letter-spacing:.12em;color:var(--text3);margin-bottom:.6rem;

}
.section-title:first-child{margin-top:0}
.replaces-box{

}
.replaces-role{font-size:.85rem;font-weight:700;color:#FF6B6B}
.replaces-cost{font-size:.7rem;color:var(--text2);margin-top:.15rem}
.ladder{display:flex;flex-direction:column;gap:.4rem}
.ladder-step{

  padding:.6rem .75rem;border-radius:6px;background:#0A0A20;
  border:1px solid var(--panel-border);
}
.ladder-step.current{border-color:var(--flame);background:var(--flame-dim)}
.ladder-label{
  font-size:.55rem;font-weight:700;text-transform:uppercase;
  letter-spacing:.06em;min-width:5.5rem;padding-top:.1rem;

}
.ladder-step.current .ladder-label{color:var(--flame)}
.ladder-desc{font-size:.72rem;color:var(--text2);line-height:1.4}
.tag-list{display:flex;flex-wrap:wrap;gap:.3rem}
.tag{

/* Dept panel extras */

.dept-agent-card{

/* Legend */
.legend{

/* Title */

.back-link{

/* Instruction */
.instruction{

/* Stats overlay */

    human: 'CEO reviews DVRI report in morning standup. Decides which insights to incorporate into next batch.',

    ],

    skills: ['Guess-the-Icon comment game', 'Comment response templates', 'DM conversation flows', 'Engagement loop optimization', 'Spam/bot detection'],
  },

    ladder: [
      { level: 'Human-Led', desc: 'User manually tracks what to do each day', current: false },
      { level: 'Human-Assisted', desc: 'Agent generates daily task list and weekly batch plan, user adjusts', current: true },
      { level: 'Fully Autonomous', desc: 'Auto-schedules production sprints, re-prioritizes on buffer level changes', current: false },
    ],
    buildsOn: ['ceo'],
    breaksInto: ['calendar', 'content'],
    human: 'CEO approves weekly batch plan every Sunday. Daily tasks shown in morning standup.',
    skills: ['7-day buffer management', 'Sunday batch sprint planning', 'Daily task scheduling', 'Cross-agent coordination', 'Deadline tracking & alerts'],
  },
  {
    id: 'calendar', name: 'Scheduler', emoji: '📅', dept: 'operations',
    role: 'Posting schedule & GitHub Actions autoposter',
    replaces: { role: 'Social Media Scheduler', cost: '₹50K/year (tool cost)' },
    ladder: [
      { level: 'Human-Led', desc: 'User manually schedules each post', current: false },
      { level: 'Human-Assisted', desc: 'Agent proposes optimal times, user confirms. GitHub Actions auto-publishes.', current: true },
      { level: 'Fully Autonomous', desc: 'Auto-schedules at optimal times, adjusts based on timezone engagement data', current: false },
    ],
    buildsOn: ['planner'],
    breaksInto: [],
    human: 'Reviews scheduled_posts.json for accuracy. Autoposter runs every 5 minutes via GitHub Actions.',
    skills: ['2-slot daily scheduling (7AM + 7PM IST)', 'GitHub Actions cron management', 'Cloudinary upload orchestration', 'Instagram Graph API publishing', 'Post status tracking'],
  },
];

// ─── Build agent-to-agent links ───
const AGENT_LINKS = [];
AGENTS.forEach(a => {
  (a.breaksInto || []).forEach(t => { AGENT_LINKS.push({ source: a.id, target: t }); });
  (a.buildsOn || []).forEach(t => { AGENT_LINKS.push({ source: t, target: a.id }); });
});

// ─── Build hierarchical nodes: Brain → Departments → Agents ───
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
let W, H, dpr;
let camX = 0, camY = 0, camZ = 1;
let dragging = false, dragStart = { x: 0, y: 0 }, camStart = { x: 0, y: 0 };
let hoveredNode = null, selectedNode = null;
let stars = [];
let tick = 0;

function resize() {
  dpr = window.devicePixelRatio || 1;
  W = window.innerWidth;
  H = window.innerHeight;
  canvas.width = W * dpr;
  canvas.height = H * dpr;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}
window.addEventListener('resize', resize);
resize();

// Generate background stars
for (let i = 0; i < 300; i++) {
  stars.push({
    x: (Math.random() - 0.5) * 3000,
    y: (Math.random() - 0.5) * 3000,
    r: Math.random() * 1.2 + 0.2,
    a: Math.random() * 0.5 + 0.1,
    speed: Math.random() * 0.002 + 0.001,
  });
}

// ─── Node Hierarchy ───

// Brain node (center)
const brainNode = {
  id: '_brain', type: 'brain', name: 'Insta Garam Studio', emoji: '🧠',
  role: 'The Company Brain — learns, adapts & evolves with every cycle', color: '#E85A2A',
  x: 0, y: 0, vx: 0, vy: 0, radius: 42, fixed: true,
};

// Department hub nodes (orbit the brain)
const deptAngles = { command: -Math.PI/2, creative: -Math.PI/2 - 1.257, production: -Math.PI/2 + 1.257, growth: Math.PI/2 + 0.628, operations: Math.PI/2 - 0.628 };
const DEPT_ORBIT = 200;
const deptNodes = Object.entries(DEPTS).map(([key, d]) => {
  const angle = deptAngles[key];
  return {
    id: '_dept_' + key, type: 'dept', deptKey: key,
    name: d.label, emoji: d.emoji, role: d.desc, color: d.color,
    x: Math.cos(angle) * DEPT_ORBIT,
    y: Math.sin(angle) * DEPT_ORBIT,
    vx: 0, vy: 0, radius: 28, targetAngle: angle,
  };
});

// Agent nodes (orbit their department hub)
const AGENT_ORBIT = 110;
const agentNodes = AGENTS.map(a => {
  const deptHub = deptNodes.find(d => d.deptKey === a.dept);
  const siblings = AGENTS.filter(x => x.dept === a.dept);
  const idx = siblings.indexOf(a);
  const count = siblings.length;
  const angleSpread = Math.PI * 0.8;
  const baseAngle = deptHub.targetAngle;
  const angle = baseAngle + (idx - (count - 1) / 2) * (angleSpread / Math.max(count - 1, 1));
  return {
    ...a,
    type: 'agent',
    x: deptHub.x + Math.cos(angle) * AGENT_ORBIT,
    y: deptHub.y + Math.sin(angle) * AGENT_ORBIT,
    vx: 0, vy: 0,
    radius: 18,
    color: DEPTS[a.dept].color,
    parentDept: deptHub.id,
    targetAngle: angle,
  };
});

// All nodes combined
const allNodes = [brainNode, ...deptNodes, ...agentNodes];
const nodeMap = {};
allNodes.forEach(n => nodeMap[n.id] = n);

// ─── Links: Brain→Dept, Dept→Agent, Agent→Agent ───
const LINKS = [];
// Brain to each department
deptNodes.forEach(d => {
  LINKS.push({ source: '_brain', target: d.id, type: 'hierarchy', weight: 3 });
});
// Department to its agents
agentNodes.forEach(a => {
  LINKS.push({ source: a.parentDept, target: a.id, type: 'hierarchy', weight: 2 });
});
// Agent-to-agent cross-links
AGENT_LINKS.forEach(l => {
  LINKS.push({ source: l.source, target: l.target, type: 'cross', weight: 1 });
});

// ─── Physics ───
function simulate() {
  // Repulsion between all nodes
  for (let i = 0; i < allNodes.length; i++) {
    if (allNodes[i].fixed) continue;
    for (let j = i + 1; j < allNodes.length; j++) {
      if (allNodes[j].fixed) continue;
      let dx = allNodes[j].x - allNodes[i].x;
      let dy = allNodes[j].y - allNodes[i].y;
      let d = Math.sqrt(dx * dx + dy * dy) || 1;
      let minDist = (allNodes[i].radius + allNodes[j].radius) * 2.5;
      if (d < minDist) {
        let f = (minDist - d) * 0.15;
        let fx = (dx / d) * f;
        let fy = (dy / d) * f;
        allNodes[i].vx -= fx; allNodes[i].vy -= fy;
        allNodes[j].vx += fx; allNodes[j].vy += fy;
      }
    }
  }

  // Dept nodes orbit brain
  deptNodes.forEach(n => {
    const tx = Math.cos(n.targetAngle) * DEPT_ORBIT;
    const ty = Math.sin(n.targetAngle) * DEPT_ORBIT;
    n.vx += (tx - n.x) * 0.04;
    n.vy += (ty - n.y) * 0.04;
  });

  // Agent nodes orbit their dept hub
  agentNodes.forEach(n => {
    const hub = nodeMap[n.parentDept];
    const tx = hub.x + Math.cos(n.targetAngle) * AGENT_ORBIT;
    const ty = hub.y + Math.sin(n.targetAngle) * AGENT_ORBIT;
    n.vx += (tx - n.x) * 0.03;
    n.vy += (ty - n.y) * 0.03;
  });

  // Damping + update
  allNodes.forEach(n => {
    if (n.fixed) return;
    n.vx *= 0.8; n.vy *= 0.8;
    n.x += n.vx; n.y += n.vy;
  });
}

// Run initial simulation
for (let i = 0; i < 300; i++) simulate();

// ─── Rendering ───
function worldToScreen(wx, wy) {
  return { x: (wx - camX) * camZ + W / 2, y: (wy - camY) * camZ + H / 2 };
}
function screenToWorld(sx, sy) {
  return { x: (sx - W / 2) / camZ + camX, y: (sy - H / 2) / camZ + camY };
}

function draw() {
  tick++;
  ctx.clearRect(0, 0, W, H);

  // Background gradient
  const bg = ctx.createRadialGradient(W/2, H/2, 0, W/2, H/2, Math.max(W, H) * 0.7);
  bg.addColorStop(0, '#0E0E28');
  bg.addColorStop(1, '#08081A');
  ctx.fillStyle = bg;
  ctx.fillRect(0, 0, W, H);

  // Stars
  stars.forEach(s => {
    const p = worldToScreen(s.x, s.y);
    const flicker = Math.sin(tick * s.speed * 2 + s.x) * 0.3 + 0.7;
    ctx.globalAlpha = s.a * flicker;
    ctx.fillStyle = '#FFFFFF';
    ctx.beginPath();
    ctx.arc(p.x, p.y, s.r * camZ, 0, Math.PI * 2);
    ctx.fill();
  });
  ctx.globalAlpha = 1;

  // ── Draw links ──
  LINKS.forEach(l => {
    const a = nodeMap[l.source], b = nodeMap[l.target];
    if (!a || !b) return;
    const pa = worldToScreen(a.x, a.y);
    const pb = worldToScreen(b.x, b.y);

    const isSelected = selectedNode && (selectedNode.id === l.source || selectedNode.id === l.target);
    const isHover = hoveredNode && (hoveredNode.id === l.source || hoveredNode.id === l.target);

    if (l.type === 'hierarchy') {
      // Department hierarchy links — thicker, colored
      ctx.beginPath();
      ctx.moveTo(pa.x, pa.y);
      ctx.lineTo(pb.x, pb.y);
      if (isSelected) {
        ctx.strokeStyle = b.color + 'CC';
        ctx.lineWidth = 3 * camZ;
      } else if (isHover) {
        ctx.strokeStyle = b.color + '66';
        ctx.lineWidth = 2 * camZ;
      } else {
        ctx.strokeStyle = b.color + '25';
        ctx.lineWidth = 1.5 * camZ;
      }
      ctx.stroke();

      // Animated particles on hierarchy links
      if (isSelected || isHover) {
        const t = (tick * 0.012) % 1;
        const px = pa.x + (pb.x - pa.x) * t;
        const py = pa.y + (pb.y - pa.y) * t;
        ctx.beginPath();
        ctx.arc(px, py, 2.5 * camZ, 0, Math.PI * 2);
        ctx.fillStyle = b.color;
        ctx.fill();
      }
    } else {
      // Cross-links — thinner, dashed look
      ctx.beginPath();
      ctx.setLineDash([4 * camZ, 4 * camZ]);
      ctx.moveTo(pa.x, pa.y);
      ctx.lineTo(pb.x, pb.y);
      if (isSelected) {
        ctx.strokeStyle = '#FFFFFF55';
        ctx.lineWidth = 1.5 * camZ;
      } else if (isHover) {
        ctx.strokeStyle = '#FFFFFF33';
        ctx.lineWidth = 1 * camZ;
      } else {
        ctx.strokeStyle = '#FFFFFF0C';
        ctx.lineWidth = 0.5 * camZ;
      }
      ctx.stroke();
      ctx.setLineDash([]);
    }
  });

  // ── Draw nodes (bottom layer first: agents, then depts, then brain) ──
  const drawOrder = [...agentNodes, ...deptNodes, brainNode];

  drawOrder.forEach(n => {
    const p = worldToScreen(n.x, n.y);
    const r = n.radius * camZ;
    const isSelected = selectedNode && selectedNode.id === n.id;
    const isHovered = hoveredNode && hoveredNode.id === n.id;
    const isConnected = selectedNode && LINKS.some(l =>
      (l.source === selectedNode.id && l.target === n.id) ||
      (l.target === selectedNode.id && l.source === n.id)
    );
    const isDimmed = selectedNode && !isSelected && !isConnected;

    // Glow
    if (isSelected || isHovered || n.type === 'brain') {
      const glowR = n.type === 'brain' ? r * 4 : r * 3;
      const glow = ctx.createRadialGradient(p.x, p.y, r * 0.3, p.x, p.y, glowR);
      const alpha = (isSelected || isHovered) ? '50' : '20';
      glow.addColorStop(0, n.color + alpha);
      glow.addColorStop(1, n.color + '00');
      ctx.fillStyle = glow;
      ctx.beginPath();
      ctx.arc(p.x, p.y, glowR, 0, Math.PI * 2);
      ctx.fill();
    }

    // Pulse ring for selected
    if (isSelected) {
      const pulseR = r + (Math.sin(tick * 0.05) * 4 + 6) * camZ;
      ctx.beginPath();
      ctx.arc(p.x, p.y, pulseR, 0, Math.PI * 2);
      ctx.strokeStyle = n.color + '40';
      ctx.lineWidth = 1.5 * camZ;
      ctx.stroke();
    }

    // Brain breathing pulse + orbit ring
    if (n.type === 'brain' && !isDimmed) {
      // Breathing pulse rings
      const breathe1 = Math.sin(tick * 0.025) * 0.3 + 0.7;
      const breathe2 = Math.sin(tick * 0.018 + 1) * 0.2 + 0.5;
      ctx.beginPath();
      ctx.arc(p.x, p.y, (r + 8 * breathe1) * camZ + 4, 0, Math.PI * 2);
      ctx.strokeStyle = n.color + Math.round(breathe1 * 40).toString(16).padStart(2, '0');
      ctx.lineWidth = 1.5 * camZ;
      ctx.stroke();
      ctx.beginPath();
      ctx.arc(p.x, p.y, (r + 18 * breathe2) * camZ + 8, 0, Math.PI * 2);
      ctx.strokeStyle = n.color + Math.round(breathe2 * 25).toString(16).padStart(2, '0');
      ctx.lineWidth = 1 * camZ;
      ctx.stroke();

      // Orbit ring
      ctx.beginPath();
      ctx.arc(p.x, p.y, DEPT_ORBIT * camZ, 0, Math.PI * 2);
      ctx.strokeStyle = '#FFFFFF08';
      ctx.lineWidth = 1 * camZ;
      ctx.stroke();
    }

    // Node circle
    ctx.globalAlpha = isDimmed ? 0.2 : 1;
    ctx.beginPath();
    ctx.arc(p.x, p.y, r, 0, Math.PI * 2);
    const grad = ctx.createRadialGradient(p.x - r * 0.3, p.y - r * 0.3, 0, p.x, p.y, r);
    if (n.type === 'brain') {
      grad.addColorStop(0, '#FF6633');
      grad.addColorStop(1, '#CC3300');
    } else if (n.type === 'dept') {
      grad.addColorStop(0, n.color + 'EE');
      grad.addColorStop(1, n.color + '99');
    } else {
      grad.addColorStop(0, n.color);
      grad.addColorStop(1, n.color + 'AA');
    }
    ctx.fillStyle = grad;
    ctx.fill();

    // Border
    ctx.strokeStyle = isSelected ? '#FFFFFF' : (n.type === 'brain' ? '#FF8855' : n.color);
    ctx.lineWidth = (isSelected ? 2.5 : n.type === 'brain' ? 2 : 1) * camZ;
    ctx.stroke();

    // Emoji
    const emojiSize = n.type === 'brain' ? 24 : (n.type === 'dept' ? 16 : 12);
    const fontSize = Math.max(8, emojiSize * camZ);
    ctx.font = `${fontSize}px -apple-system,system-ui,sans-serif`;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(n.emoji, p.x, p.y + 1);

    // Name label
    if (camZ > 0.4) {
      const labelSize = n.type === 'brain' ? 12 : (n.type === 'dept' ? 10 : 9);
      ctx.font = `${n.type === 'brain' ? 800 : 600} ${Math.max(7, labelSize * camZ)}px -apple-system,system-ui,sans-serif`;
      ctx.fillStyle = isDimmed ? '#FFFFFF20' : (n.type === 'brain' ? '#FFFFFFEE' : '#FFFFFFBB');
      ctx.textBaseline = 'top';
      ctx.fillText(n.name, p.x, p.y + r + 5 * camZ);

      // Dept nodes show agent count underneath
      if (n.type === 'dept' && camZ > 0.6) {
        const count = AGENTS.filter(a => a.dept === n.deptKey).length;
        ctx.font = `600 ${Math.max(6, 7 * camZ)}px -apple-system,system-ui,sans-serif`;
        ctx.fillStyle = isDimmed ? '#FFFFFF15' : n.color + '88';
        ctx.fillText(count + ' agents', p.x, p.y + r + 5 * camZ + Math.max(9, 12 * camZ));
      }
    }

    ctx.globalAlpha = 1;
  });

  // Continue simulation gently
  if (tick < 500) simulate();

  requestAnimationFrame(draw);
}

// ─── Interaction ───
function getNodeAt(sx, sy) {
  const w = screenToWorld(sx, sy);
  // Check in reverse draw order (brain first since it's on top)
  const checkOrder = [brainNode, ...deptNodes, ...agentNodes];
  for (const n of checkOrder) {
    const dx = w.x - n.x, dy = w.y - n.y;
    if (dx * dx + dy * dy < (n.radius + 5) * (n.radius + 5)) return n;
  }
  return null;
}

canvas.addEventListener('mousedown', e => {
  const node = getNodeAt(e.clientX, e.clientY);
  if (node) return;
  dragging = true;
  dragStart = { x: e.clientX, y: e.clientY };
  camStart = { x: camX, y: camY };
});

canvas.addEventListener('mousemove', e => {
  if (dragging) {
    camX = camStart.x - (e.clientX - dragStart.x) / camZ;
    camY = camStart.y - (e.clientY - dragStart.y) / camZ;
    return;
  }
  const node = getNodeAt(e.clientX, e.clientY);
  hoveredNode = node;
  canvas.classList.toggle('hovering', !!node);
});

canvas.addEventListener('mouseup', () => { dragging = false; });
canvas.addEventListener('mouseleave', () => { dragging = false; hoveredNode = null; });

canvas.addEventListener('click', e => {
  const node = getNodeAt(e.clientX, e.clientY);
  if (node) {
    selectedNode = node;
    openPanel(node);
    document.getElementById('instruction').classList.add('hidden');
  } else if (!dragging) {
    closePanel();
  }
});

canvas.addEventListener('wheel', e => {
  e.preventDefault();
  const zoomFactor = e.deltaY > 0 ? 0.9 : 1.1;
  const newZ = Math.max(0.25, Math.min(3, camZ * zoomFactor));
  const w = screenToWorld(e.clientX, e.clientY);
  camZ = newZ;
  camX = w.x - (e.clientX - W / 2) / camZ;
  camY = w.y - (e.clientY - H / 2) / camZ;
}, { passive: false });

// Touch support
let lastTouchDist = 0;
canvas.addEventListener('touchstart', e => {
  if (e.touches.length === 1) {
    const t = e.touches[0];
    const node = getNodeAt(t.clientX, t.clientY);
    if (node) { selectedNode = node; openPanel(node); document.getElementById('instruction').classList.add('hidden'); return; }
    dragging = true;
    dragStart = { x: t.clientX, y: t.clientY };
    camStart = { x: camX, y: camY };
  } else if (e.touches.length === 2) {
    const dx = e.touches[1].clientX - e.touches[0].clientX;
    const dy = e.touches[1].clientY - e.touches[0].clientY;
    lastTouchDist = Math.sqrt(dx * dx + dy * dy);
  }
});
canvas.addEventListener('touchmove', e => {
  e.preventDefault();
  if (e.touches.length === 1 && dragging) {
    const t = e.touches[0];
    camX = camStart.x - (t.clientX - dragStart.x) / camZ;
    camY = camStart.y - (t.clientY - dragStart.y) / camZ;
  } else if (e.touches.length === 2) {
    const dx = e.touches[1].clientX - e.touches[0].clientX;
    const dy = e.touches[1].clientY - e.touches[0].clientY;
    const dist = Math.sqrt(dx * dx + dy * dy);
    if (lastTouchDist) {
      camZ = Math.max(0.25, Math.min(3, camZ * (dist / lastTouchDist)));
    }
    lastTouchDist = dist;
  }
}, { passive: false });
canvas.addEventListener('touchend', () => { dragging = false; lastTouchDist = 0; });

// ─── Panel ───
function openPanel(node) {
  document.getElementById('pEmoji').textContent = node.emoji;
  document.getElementById('pName').textContent = node.name;
  document.getElementById('pRole').textContent = node.role;

  const badge = document.getElementById('pDept');
  let html = '';

  if (node.type === 'brain') {
    // Brain panel — company overview
    badge.textContent = 'Company Brain';
    badge.style.background = node.color + '20';
    badge.style.color = node.color;
    badge.style.border = '1px solid ' + node.color + '40';

    html += '<div class="section-title">Departments</div><div class="dept-agents-list">';
    deptNodes.forEach(d => {
      const agentCount = AGENTS.filter(a => a.dept === d.deptKey).length;
      html += '<div class="dept-agent-card" onclick="selectById(\'' + d.id + '\')">';
      html += '<div class="dept-agent-emoji">' + d.emoji + '</div>';
      html += '<div class="dept-agent-info"><div class="dept-agent-name" style="color:' + d.color + '">' + d.name + '</div>';
      html += '<div class="dept-agent-role">' + agentCount + ' agents — ' + d.role + '</div></div></div>';
    });
    html += '</div>';

    html += '<div class="section-title">Pipeline Flow</div>';
    html += '<div class="human-note" style="font-size:.65rem;line-height:1.6">Content Package → QA Review (CVI ≥ 70) → Gemini Generation → FFmpeg Processing → QC Inspection → CEO Approval → Autoposter → Post</div>';

    html += '<div class="section-title">🧠 Living Brain — Always Learning</div>';
    html += '<div class="human-note" style="border-left-color:var(--growth);font-size:.68rem;line-height:1.6">This is not a static system. The company brain continuously absorbs new knowledge — every posted reel\'s performance data, every CEO decision, every viral trend spotted, every QC rejection reason — and feeds learnings back into the pipeline. Each cycle makes the next one smarter.</div>';

    html += '<div class="section-title">Knowledge Loops</div>';
    html += '<div class="skills-list">';
    html += '<div class="skill">Post performance → Analytics → adjusts what content gets made</div>';
    html += '<div class="skill">CVI predictions vs actual → QA recalibrates scoring weights</div>';
    html += '<div class="skill">CEO rejections → Content learns what to avoid</div>';
    html += '<div class="skill">DVRI daily scans → Viral feeds trends into next batch</div>';
    html += '<div class="skill">Comment patterns → Community refines engagement strategy</div>';
    html += '<div class="skill">Pappu Express benchmarks → QC tightens quality bar over time</div>';
    html += '</div>';

    html += '<div class="section-title">Operating Rhythm</div>';
    html += '<div class="skills-list">';
    html += '<div class="skill">2 reels/day (7 AM + 7 PM IST)</div>';
    html += '<div class="skill">CVI ≥ 70 to proceed</div>';
    html += '<div class="skill">Buffer target: 7 days (14 packages)</div>';
    html += '<div class="skill">Sunday batch planning sprint</div>';
    html += '<div class="skill">CEO single-approval workflow</div>';
    html += '<div class="skill">Morning standup → nightly scratchpad review</div>';
    html += '</div>';

  } else if (node.type === 'dept') {
    // Department panel — list its agents
    badge.textContent = node.name + ' Department';
    badge.style.background = node.color + '20';
    badge.style.color = node.color;
    badge.style.border = '1px solid ' + node.color + '40';

    const deptAgents = AGENTS.filter(a => a.dept === node.deptKey);

    html += '<div class="section-title">Agents in ' + node.name + '</div><div class="dept-agents-list">';
    deptAgents.forEach(a => {
      html += '<div class="dept-agent-card" onclick="selectById(\'' + a.id + '\')">';
      html += '<div class="dept-agent-emoji">' + a.emoji + '</div>';
      html += '<div class="dept-agent-info"><div class="dept-agent-name">' + a.name + '</div>';
      html += '<div class="dept-agent-role">' + a.role + '</div></div></div>';
    });
    html += '</div>';

    // Total cost replaced
    const totalCost = deptAgents.map(a => a.replaces.cost).join(', ');
    html += '<div class="section-title">Human Cost Replaced</div>';
    html += '<div class="replaces-box">';
    deptAgents.forEach(a => {
      html += '<div style="display:flex;justify-content:space-between;margin-bottom:.3rem"><span class="replaces-role" style="font-size:.72rem">' + a.replaces.role + '</span><span style="font-size:.65rem;color:var(--text2)">' + a.replaces.cost + '</span></div>';
    });
    html += '</div>';

  } else {
    // Agent panel — full detail
    badge.textContent = DEPTS[node.dept].label;
    badge.style.background = node.color + '20';
    badge.style.color = node.color;
    badge.style.border = '1px solid ' + node.color + '40';

    // What it replaces
    html += '<div class="section-title">What It Replaces</div>';
    html += '<div class="replaces-box"><div class="replaces-role">' + node.replaces.role + '</div>';
    html += '<div class="replaces-cost">' + node.replaces.cost + '</div></div>';

    // The Ladder
    html += '<div class="section-title">The Automation Ladder</div><div class="ladder">';
    node.ladder.forEach(l => {
      html += '<div class="ladder-step' + (l.current ? ' current' : '') + '">';
      html += '<div class="ladder-label">' + l.level + '</div>';
      html += '<div class="ladder-desc">' + l.desc + '</div></div>';
    });
    html += '</div>';

    // Breaks into
    if (node.breaksInto && node.breaksInto.length) {
      html += '<div class="section-title">Feeds Into</div><div class="tag-list">';
      node.breaksInto.forEach(id => {
        const t = nodeMap[id];
        if (t) html += '<div class="tag" style="cursor:pointer;border-color:' + t.color + '40;color:' + t.color + '" onclick="selectById(\'' + id + '\')">' + t.emoji + ' ' + t.name + '</div>';
      });
      html += '</div>';
    }

    // Builds on
    if (node.buildsOn && node.buildsOn.length) {
      html += '<div class="section-title">Builds On</div><div class="tag-list">';
      node.buildsOn.forEach(id => {
        const t = nodeMap[id];
        if (t) html += '<div class="tag" style="cursor:pointer;border-color:' + t.color + '40;color:' + t.color + '" onclick="selectById(\'' + id + '\')">' + t.emoji + ' ' + t.name + '</div>';
      });
      html += '</div>';
    }

    // The Human
    html += '<div class="section-title">The Human</div>';
    html += '<div class="human-note">' + node.human + '</div>';

    // Skills
    html += '<div class="section-title">Skills</div><div class="skills-list">';
    node.skills.forEach(s => { html += '<div class="skill">' + s + '</div>'; });
    html += '</div>';
  }

  document.getElementById('pBody').innerHTML = html;
  document.getElementById('panel').classList.add('open');
}

function closePanel() {
  document.getElementById('panel').classList.remove('open');
  selectedNode = null;
}

function selectById(id) {
  const n = nodeMap[id];
  if (n) { selectedNode = n; openPanel(n); }
}

// ─── Legend ───
(function buildLegend() {
  const el = document.getElementById('legend');
  el.innerHTML = Object.entries(DEPTS).map(([k, d]) =>
    '<div class="legend-item" onclick="focusDept(\'' + k + '\')">' +
    '<div class="legend-dot" style="background:' + d.color + ';box-shadow:0 0 6px ' + d.color + '"></div>' +
    '<div class="legend-label">' + d.label + '</div></div>'
  ).join('');
})();

function focusDept(deptKey) {
  const hub = deptNodes.find(d => d.deptKey === deptKey);
  if (!hub) return;
  const startX = camX, startY = camY, startZ = camZ;
  const targetZ = 1.5;
  let t = 0;
  function animStep() {
    t += 0.03;
    if (t > 1) t = 1;
    const ease = 1 - Math.pow(1 - t, 3);
    camX = startX + (hub.x - startX) * ease;
    camY = startY + (hub.y - startY) * ease;
    camZ = startZ + (targetZ - startZ) * ease;
    if (t < 1) requestAnimationFrame(animStep);
  }
  animStep();
}

// Hide instruction after 4 seconds
setTimeout(() => { document.getElementById('instruction').classList.add('hidden'); }, 4000);

// Start
draw();
</script>
