<meta charset="UTF-8">
<title>Insta Garam — Agent Map</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#080B14;--card:#111827;--card2:#0F172A;--border:#1F2937;--border2:#374151;
  --text:#E5E7EB;--text2:#9CA3AF;--text3:#6B7280;
  --gold:#D4A853;--gold-dim:#D4A85320;--gold-glow:#D4A85340;
  --content:#8B5CF6;--content-dim:#8B5CF620;
  --quality:#10B981;--quality-dim:#10B98120;
  --growth:#3B82F6;--growth-dim:#3B82F620;
  --ops:#06B6D4;--ops-dim:#06B6D420;
}
html,body{
  background:var(--bg);color:var(--text);
  font-family:system-ui,-apple-system,'Segoe UI',sans-serif;
  height:100%;overflow:hidden;-webkit-font-smoothing:antialiased;
}
canvas{display:block;width:100%;height:100%;cursor:grab}
canvas:active{cursor:grabbing}
canvas.hovering{cursor:pointer}

/* Panel — frosted glass */
.panel{
  position:fixed;right:-440px;top:0;bottom:0;width:420px;max-width:88vw;
  background:rgba(17,24,39,.92);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);
  border-left:1px solid var(--border);
  z-index:100;transition:right .4s cubic-bezier(.4,0,.2,1);
  overflow-y:auto;padding:0;
}
.panel.open{right:0}
.panel-header{
  padding:1.75rem 1.75rem 1.25rem;position:sticky;top:0;
  background:rgba(17,24,39,.95);backdrop-filter:blur(24px);z-index:1;
  border-bottom:1px solid var(--border);
}
.panel-close{
  position:absolute;top:1.25rem;right:1.25rem;width:28px;height:28px;
  border:1px solid var(--border);border-radius:4px;background:transparent;
  color:var(--text3);cursor:pointer;font-size:.9rem;display:flex;
  align-items:center;justify-content:center;transition:all .15s;
}
.panel-close:hover{background:var(--border);color:var(--text)}
.panel-emoji{font-size:2rem;margin-bottom:.4rem}
.panel-name{font-size:1.3rem;font-weight:800;letter-spacing:-.03em}
.panel-role{font-size:.72rem;color:var(--text2);margin-top:.2rem;font-weight:400;line-height:1.4}
.panel-badges{display:flex;gap:.4rem;margin-top:.6rem;flex-wrap:wrap}
.pbadge{
  font-size:.5rem;font-weight:700;text-transform:uppercase;
  letter-spacing:.08em;padding:.2rem .55rem;border-radius:3px;
}
.pbadge.lead{background:var(--gold-dim);color:var(--gold);border:1px solid var(--gold)}
.panel-body{padding:1.75rem}
.sec{margin-bottom:1.5rem}
.sec-title{
  font-size:.55rem;font-weight:700;text-transform:uppercase;
  letter-spacing:.14em;color:var(--text3);margin-bottom:.65rem;
  display:flex;align-items:center;gap:.5rem;
}
.sec-title::after{content:'';flex:1;height:1px;background:var(--border)}
.cost-box{
  display:flex;justify-content:space-between;align-items:center;
  padding:.75rem 1rem;background:var(--card2);border:1px solid var(--border);border-radius:6px;
}
.cost-role{font-size:.78rem;font-weight:600}
.cost-val{font-size:.85rem;font-weight:800;color:#F87171}
.ladder{display:flex;flex-direction:column;gap:.35rem}
.ladder-step{
  display:flex;align-items:center;gap:.6rem;
  padding:.55rem .75rem;border-radius:5px;background:var(--card2);
  border:1px solid var(--border);transition:all .15s;
}
.ladder-step.current{border-color:var(--gold);background:var(--gold-dim)}
.ladder-marker{
  width:8px;height:8px;border-radius:50%;border:2px solid var(--text3);flex-shrink:0;
}
.ladder-step.current .ladder-marker{background:var(--gold);border-color:var(--gold);box-shadow:0 0 8px var(--gold-glow)}
.ladder-info{flex:1}
.ladder-level{font-size:.55rem;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--text3)}
.ladder-step.current .ladder-level{color:var(--gold)}
.ladder-desc{font-size:.68rem;color:var(--text2);line-height:1.4;margin-top:.1rem}
.tags{display:flex;flex-wrap:wrap;gap:.3rem}
.tag{
  font-size:.58rem;font-weight:600;padding:.2rem .5rem;
  border-radius:3px;background:var(--card2);border:1px solid var(--border);
  color:var(--text2);cursor:pointer;transition:all .15s;
}
.tag:hover{border-color:var(--text3);color:var(--text)}
.human-box{
  font-size:.7rem;color:var(--text2);line-height:1.55;
  padding:.75rem 1rem;background:var(--card2);border-radius:5px;
  border-left:2px solid var(--gold);
}
.skills{display:flex;flex-wrap:wrap;gap:.25rem}
.skill-pill{
  font-size:.55rem;font-weight:500;padding:.2rem .45rem;
  border-radius:10px;background:var(--card2);border:1px solid var(--border);
  color:var(--text2);
}
/* Division panel cards */
.agent-card{
  display:flex;align-items:center;gap:.65rem;
  padding:.6rem .75rem;background:var(--card2);border:1px solid var(--border);
  border-radius:6px;cursor:pointer;transition:all .15s;margin-bottom:.35rem;
}
.agent-card:hover{border-color:var(--text3);background:var(--card)}
.agent-card .ac-emoji{font-size:1rem}
.agent-card .ac-info{flex:1}
.agent-card .ac-name{font-size:.72rem;font-weight:700}
.agent-card .ac-role{font-size:.58rem;color:var(--text2)}
.agent-card .ac-lead{font-size:.45rem;font-weight:700;color:var(--gold);text-transform:uppercase;letter-spacing:.06em}

/* Legend */
.legend{
  position:fixed;bottom:1rem;left:50%;transform:translateX(-50%);
  display:flex;gap:1.5rem;padding:.55rem 1.5rem;
  background:rgba(17,24,39,.88);backdrop-filter:blur(16px);
  border:1px solid var(--border);border-radius:6px;z-index:50;
  flex-wrap:wrap;justify-content:center;
}
.legend-item{display:flex;align-items:center;gap:.35rem;cursor:pointer;transition:opacity .2s}
.legend-item:hover{opacity:.7}
.legend-dot{width:7px;height:7px;border-radius:50%}
.legend-label{font-size:.55rem;font-weight:600;color:var(--text2);text-transform:uppercase;letter-spacing:.08em}

/* Title */
.title-bar{position:fixed;top:1.25rem;left:1.75rem;z-index:50}
.title-bar h1{font-size:1rem;font-weight:800;letter-spacing:-.02em}
.title-bar h1 span{color:var(--gold)}
.title-logo{width:28px;height:28px;vertical-align:middle;margin-right:2px;border-radius:4px}
.title-bar p{font-size:.6rem;color:var(--text3);margin-top:.2rem;text-transform:uppercase;letter-spacing:.12em}
.back-link{
  display:inline-flex;align-items:center;gap:.3rem;margin-top:.5rem;
  font-size:.55rem;font-weight:600;color:var(--text2);text-decoration:none;
  padding:.25rem .5rem;border:1px solid var(--border);border-radius:4px;transition:all .15s;
}
.back-link:hover{background:var(--border);color:var(--text)}

/* Stats */
.stats{position:fixed;top:1.25rem;right:1.75rem;z-index:50;text-align:right;display:flex;gap:1.5rem}
.stat-block .num{font-size:1.6rem;font-weight:800;font-variant-numeric:tabular-nums;line-height:1}
.stat-block .label{font-size:.5rem;text-transform:uppercase;letter-spacing:.12em;color:var(--text3);font-weight:600}

/* Instruction */
.instruction{
  position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);
  text-align:center;pointer-events:none;z-index:10;transition:opacity 1.5s;
}
.instruction.hidden{opacity:0}
.instruction h2{font-size:1.3rem;font-weight:800;letter-spacing:-.02em;margin-bottom:.3rem}
.instruction p{font-size:.75rem;color:var(--text2)}
</style>

<script>
// ─── Data ───
// Load logo for brain node
const logoImg = new Image();
logoImg.src = 'logo_dark.png';
let logoLoaded = false;
logoImg.onload = () => { logoLoaded = true; };

const DIVS = {
  content: { label:'Content Studio', color:'#8B5CF6', emoji:'🎬', desc:'Where content is born — ideation, prompts, trend adaptation' },
  quality: { label:'Quality Assurance', color:'#10B981', emoji:'🛡️', desc:'Independent quality function — pre & post production gates' },
  growth:  { label:'Growth & Intel', color:'#3B82F6', emoji:'📊', desc:'Data, audience, distribution — everything that moves the needle' },
  ops:     { label:'Operations', color:'#06B6D4', emoji:'⚙️', desc:'Execution machine — scheduling, planning, publishing' },
};

const AGENTS = [
  {
    id:'ceo', name:'CEO Agent', emoji:'👑', div:'executive', lead:true,
    role:'Chief Executive — orchestrates all 4 divisions, single approval authority',
    replaces:{role:'Studio Manager / Producer',cost:'₹5-8L/yr'},
    ladder:[
      {level:'Human-Led',desc:'User makes all decisions, agent tracks state',current:false},
      {level:'Human-Assisted',desc:'Agent proposes daily plans, user approves via Telegram',current:true},
      {level:'Fully Autonomous',desc:'Runs morning standup, assigns tasks, escalates exceptions only',current:false},
    ],
    human:'CEO reviews morning standup and approves/rejects via Telegram. All publishing requires explicit approval.',
    skills:['Cross-division orchestration','Morning standup','Telegram approval routing','Exception escalation','Pipeline enforcement'],
    feedsInto:['content','qa','analytics','planner'],
    feedsFrom:[],
  },
  {
    id:'content', name:'Creative Director', emoji:'🎬', div:'content', lead:true,
    role:'Division Lead — content packages, Gemini prompts, captions, icon selection',
    replaces:{role:'Content Writer + Scriptwriter',cost:'₹3-5L/yr'},
    ladder:[
      {level:'Human-Led',desc:'User writes all prompts and captions manually',current:false},
      {level:'Human-Assisted',desc:'Agent generates full content packages, user edits before generation',current:true},
      {level:'Fully Autonomous',desc:'Packages go straight to QA gate with zero human input',current:false},
    ],
    human:'Reviews packages for brand voice, cultural sensitivity, and trend alignment before generation.',
    skills:['Gemini prompt engineering','Caption writing','SEO hashtag packs','Hook text overlays','Bobblehead character design'],
    feedsInto:['qa'],
    feedsFrom:['viral','community','analytics'],
  },
  {
    id:'viral', name:'Viral Strategist', emoji:'🔥', div:'content', lead:false,
    role:'R&D arm — daily viral intelligence, trend monitoring, competitor analysis',
    replaces:{role:'Social Media Analyst',cost:'₹2-4L/yr'},
    ladder:[
      {level:'Human-Led',desc:'User manually browses Instagram for inspiration',current:false},
      {level:'Human-Assisted',desc:'Scans top AI cartoon reels daily, extracts actionable takeaways',current:true},
      {level:'Fully Autonomous',desc:'DVRI feeds directly into pipeline, auto-adjusts style',current:false},
    ],
    human:'CEO reviews DVRI report in morning standup. Decides which insights to use.',
    skills:['DVRI daily scan','Competitor benchmarking','Trend pattern recognition','Pappu Express scoring','Engagement analysis'],
    feedsInto:['content'],
    feedsFrom:['analytics'],
  },
  {
    id:'qa', name:'QA Lead', emoji:'🛡️', div:'quality', lead:true,
    role:'Division Lead — pre-generation gate, CVI scoring, package validation',
    replaces:{role:'Creative QA Lead',cost:'₹2-3L/yr'},
    ladder:[
      {level:'Human-Led',desc:'User proofreads every prompt and caption',current:false},
      {level:'Human-Assisted',desc:'Agent flags issues and scores CVI, user decides',current:true},
      {level:'Fully Autonomous',desc:'Auto-rejects below CVI 70, re-routes to Creative',current:false},
    ],
    human:'QA gate blocks generation until CVI ≥ 70. User can override for urgent posts.',
    skills:['CVI 100-point scoring','Prompt validation','Caption review','Hashtag scoring','Brand compliance'],
    feedsInto:[],
    feedsFrom:['content'],
  },
  {
    id:'qc', name:'QC Inspector', emoji:'✅', div:'quality', lead:false,
    role:'Post-processing gate — video inspection, Pappu Express benchmark',
    replaces:{role:'Video QC Editor',cost:'₹2-3L/yr'},
    ladder:[
      {level:'Human-Led',desc:'User watches every video manually',current:false},
      {level:'Human-Assisted',desc:'Runs technical checks and PE benchmark (30% deviation OK)',current:true},
      {level:'Fully Autonomous',desc:'Auto-routes passing videos to CEO, auto-rejects failures',current:false},
    ],
    human:'Videos failing checks are flagged. User decides: re-generate, re-process, or override.',
    skills:['Pappu Express benchmark','FFmpeg validation','Resolution check','Logo watermark verify','1080x1920 upscale QC'],
    feedsInto:['analytics'],
    feedsFrom:[],
  },
  {
    id:'analytics', name:'Analytics Officer', emoji:'📊', div:'growth', lead:true,
    role:'Division Lead — engagement metrics, performance insights, CVI calibration',
    replaces:{role:'Data Analyst (part-time)',cost:'₹1-2L/yr'},
    ladder:[
      {level:'Human-Led',desc:'User checks Instagram insights manually',current:true},
      {level:'Human-Assisted',desc:'Pulls metrics via Graph API, generates weekly reports',current:false},
      {level:'Fully Autonomous',desc:'Auto-adjusts content mix based on engagement data',current:false},
    ],
    human:'Reviews weekly analytics in Sunday batch planning.',
    skills:['Instagram Graph API','Engagement calculation','Slot analysis (7AM vs 7PM)','Category performance','CVI calibration'],
    feedsInto:['content','viral','marketing','community'],
    feedsFrom:['qc'],
  },
  {
    id:'marketing', name:'Head of Marketing', emoji:'🚀', div:'growth', lead:false,
    role:'Distribution, hashtags, audience growth, cross-platform strategy',
    replaces:{role:'Growth Marketer',cost:'₹3-5L/yr'},
    ladder:[
      {level:'Human-Led',desc:'User researches hashtags manually',current:true},
      {level:'Human-Assisted',desc:'Generates hashtag strategies and growth experiments',current:false},
      {level:'Fully Autonomous',desc:'Auto-rotates hashtags based on performance',current:false},
    ],
    human:'Approves hashtag rotations and collaboration targets.',
    skills:['Hashtag rotation','Collaboration targeting','Cross-platform distribution','Audience segmentation','#AICartoon positioning'],
    feedsInto:['community'],
    feedsFrom:['analytics'],
  },
  {
    id:'community', name:'Community Manager', emoji:'💬', div:'growth', lead:false,
    role:'Comments, DMs, engagement loops, audience retention',
    replaces:{role:'Social Media Manager',cost:'₹1-2L/yr'},
    ladder:[
      {level:'Human-Led',desc:'User replies to all comments/DMs manually',current:true},
      {level:'Human-Assisted',desc:'Drafts reply templates, user sends with one click',current:false},
      {level:'Fully Autonomous',desc:'Auto-replies to common comments, flags unusual DMs',current:false},
    ],
    human:'Reviews all DMs. Comment replies need approval for first 100 followers.',
    skills:['Guess-the-Icon game','Reply templates','DM flows','Engagement loops','Spam detection'],
    feedsInto:['content'],
    feedsFrom:['analytics','marketing'],
  },
  {
    id:'planner', name:'Strategic Planner', emoji:'📋', div:'ops', lead:true,
    role:'Division Lead — master calendar, batch planning, cross-division coordination',
    replaces:{role:'Project Manager',cost:'₹3-5L/yr'},
    ladder:[
      {level:'Human-Led',desc:'User manually tracks daily tasks',current:false},
      {level:'Human-Assisted',desc:'Generates daily task list and weekly batch plan',current:true},
      {level:'Fully Autonomous',desc:'Auto-schedules sprints, re-prioritizes on buffer changes',current:false},
    ],
    human:'CEO approves weekly batch plan Sundays. Daily tasks in morning standup.',
    skills:['Buffer management','Sunday batch sprint','Daily scheduling','Cross-division coord','Deadline tracking'],
    feedsInto:['content','calendar'],
    feedsFrom:[],
  },
  {
    id:'calendar', name:'Scheduler', emoji:'📅', div:'ops', lead:false,
    role:'Posting schedule, autoposter sync, scheduled_posts.json management',
    replaces:{role:'Scheduling Tool',cost:'₹50K/yr'},
    ladder:[
      {level:'Human-Led',desc:'User manually schedules each post',current:false},
      {level:'Human-Assisted',desc:'Proposes times, user confirms. GitHub Actions publishes.',current:true},
      {level:'Fully Autonomous',desc:'Auto-schedules at optimal times from engagement data',current:false},
    ],
    human:'Reviews scheduled_posts.json. Autoposter runs every 5 min via GitHub Actions.',
    skills:['7AM+7PM scheduling','GitHub Actions cron','Cloudinary orchestration','Graph API publishing','Status tracking'],
    feedsInto:[],
    feedsFrom:['planner'],
  },
];

// ─── Build links ───
const ALL_LINKS = [];
AGENTS.forEach(a => {
  (a.feedsInto||[]).forEach(t => ALL_LINKS.push({source:a.id,target:t,type:a.div==='executive'?'executive':'flow'}));
});

// ─── Canvas ───
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
let W,H,dpr;
let camX=0,camY=0,camZ=1;
let dragging=false,dragStart={x:0,y:0},camStart={x:0,y:0};
let hoveredNode=null,selectedNode=null;
let stars=[];
let tick=0;

function resize(){
  dpr=window.devicePixelRatio||1;
  W=window.innerWidth;H=window.innerHeight;
  canvas.width=W*dpr;canvas.height=H*dpr;
  ctx.setTransform(dpr,0,0,dpr,0,0);
}
window.addEventListener('resize',resize);resize();

for(let i=0;i<200;i++){
  stars.push({x:(Math.random()-.5)*3000,y:(Math.random()-.5)*3000,r:Math.random()*.8+.15,a:Math.random()*.35+.05,s:Math.random()*.002+.001});
}

// ─── Position nodes in structured orbits ───
const BRAIN = {id:'_brain',type:'brain',name:'Insta Garam Studio',emoji:'🧠',
  role:'The Company Brain — continuously learns, adapts & evolves',color:'#D4A853',
  x:0,y:0,radius:40};

const CEO_ORBIT = 95;
const DIV_ORBIT = 230;
const AGENT_ORBIT = 95;

// CEO positioned above brain
const ceoData = AGENTS.find(a=>a.id==='ceo');
const ceoNode = {...ceoData,type:'agent',x:0,y:-CEO_ORBIT,radius:24,color:'#D4A853'};

// Division hubs positioned evenly around
const divKeys = ['content','quality','growth','ops'];
const divAngles = {content:-Math.PI*.75,quality:-Math.PI*.25,growth:Math.PI*.25,ops:Math.PI*.75};
const divNodes = divKeys.map(k => {
  const d = DIVS[k];
  const a = divAngles[k];
  return {id:'_div_'+k,type:'div',divKey:k,name:d.label,emoji:d.emoji,role:d.desc,
    color:d.color,x:Math.cos(a)*DIV_ORBIT,y:Math.sin(a)*DIV_ORBIT,radius:24};
});

// Agent nodes orbit their division
const agentNodes = AGENTS.filter(a=>a.id!=='ceo').map(a => {
  const divHub = divNodes.find(d=>d.divKey===a.div);
  const siblings = AGENTS.filter(x=>x.div===a.div && x.id!=='ceo');
  const idx = siblings.indexOf(a);
  const count = siblings.length;
  const baseAngle = divAngles[a.div];
  const spread = count<=2 ? Math.PI*.5 : Math.PI*.65;
  const angle = baseAngle + (idx-(count-1)/2)*(spread/Math.max(count-1,1));
  return {...a,type:'agent',
    x:divHub.x+Math.cos(angle)*AGENT_ORBIT,
    y:divHub.y+Math.sin(angle)*AGENT_ORBIT,
    radius:a.lead?20:16,color:DIVS[a.div].color};
});

const allNodes = [BRAIN,ceoNode,...divNodes,...agentNodes];
const nodeMap = {};
allNodes.forEach(n=>nodeMap[n.id]=n);

// ─── Structured links ───
const LINKS = [];
// Brain → CEO
LINKS.push({source:'_brain',target:'ceo',type:'executive'});
// CEO → Division leads
divNodes.forEach(d=>{
  const lead = AGENTS.find(a=>a.div===d.divKey && a.lead && a.id!=='ceo');
  if(lead) LINKS.push({source:'ceo',target:lead.id,type:'executive'});
});
// Division → its agents
agentNodes.forEach(a=>{
  LINKS.push({source:'_div_'+a.div,target:a.id,type:'hierarchy'});
});
// Cross-division flows
ALL_LINKS.forEach(l=>{
  if(l.source!=='ceo') LINKS.push({...l,type:'flow'});
});

// ─── Rendering ───
function w2s(wx,wy){return{x:(wx-camX)*camZ+W/2,y:(wy-camY)*camZ+H/2}}
function s2w(sx,sy){return{x:(sx-W/2)/camZ+camX,y:(sy-H/2)/camZ+camY}}

function draw(){
  tick++;
  ctx.clearRect(0,0,W,H);

  // Background
  const bg=ctx.createRadialGradient(W/2,H/2,0,W/2,H/2,Math.max(W,H)*.7);
  bg.addColorStop(0,'#0D1120');bg.addColorStop(1,'#080B14');
  ctx.fillStyle=bg;ctx.fillRect(0,0,W,H);

  // Subtle grid
  ctx.globalAlpha=.03;ctx.strokeStyle='#FFFFFF';ctx.lineWidth=1;
  const gridSize=60*camZ;
  const offX=(W/2-camX*camZ)%gridSize;
  const offY=(H/2-camY*camZ)%gridSize;
  for(let x=offX;x<W;x+=gridSize){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,H);ctx.stroke();}
  for(let y=offY;y<H;y+=gridSize){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke();}
  ctx.globalAlpha=1;

  // Stars
  stars.forEach(s=>{
    const p=w2s(s.x,s.y);
    ctx.globalAlpha=s.a*(Math.sin(tick*s.s*2+s.x)*.3+.7);
    ctx.fillStyle='#FFFFFF';ctx.beginPath();ctx.arc(p.x,p.y,s.r*camZ,0,Math.PI*2);ctx.fill();
  });
  ctx.globalAlpha=1;

  // Orbit rings
  const bc=w2s(0,0);
  [CEO_ORBIT,DIV_ORBIT].forEach(r=>{
    ctx.beginPath();ctx.arc(bc.x,bc.y,r*camZ,0,Math.PI*2);
    ctx.strokeStyle='#FFFFFF06';ctx.lineWidth=1;ctx.stroke();
  });

  // ── Links ──
  LINKS.forEach(l=>{
    const a=nodeMap[l.source],b=nodeMap[l.target];
    if(!a||!b)return;
    const pa=w2s(a.x,a.y),pb=w2s(b.x,b.y);
    const isSel=selectedNode&&(selectedNode.id===l.source||selectedNode.id===l.target);
    const isHov=hoveredNode&&(hoveredNode.id===l.source||hoveredNode.id===l.target);

    ctx.beginPath();
    if(l.type==='flow'){ctx.setLineDash([3*camZ,3*camZ]);}
    ctx.moveTo(pa.x,pa.y);ctx.lineTo(pb.x,pb.y);

    if(l.type==='executive'){
      ctx.strokeStyle=isSel?'#D4A853AA':isHov?'#D4A85366':'#D4A85318';
      ctx.lineWidth=(isSel?3:isHov?2:1.5)*camZ;
    } else if(l.type==='hierarchy'){
      const col=b.color||'#FFFFFF';
      ctx.strokeStyle=isSel?col+'AA':isHov?col+'55':col+'15';
      ctx.lineWidth=(isSel?2:isHov?1.5:1)*camZ;
    } else {
      ctx.strokeStyle=isSel?'#FFFFFF44':isHov?'#FFFFFF22':'#FFFFFF08';
      ctx.lineWidth=(isSel?1.5:1)*camZ;
    }
    ctx.stroke();ctx.setLineDash([]);

    // Flow particles
    if(isSel||isHov){
      const t=(tick*.012)%1;
      const px=pa.x+(pb.x-pa.x)*t,py=pa.y+(pb.y-pa.y)*t;
      ctx.beginPath();ctx.arc(px,py,2*camZ,0,Math.PI*2);
      ctx.fillStyle=l.type==='executive'?'#D4A853':(b.color||'#FFFFFF');ctx.fill();
    }
  });

  // ── Nodes ──
  const drawOrder=[...agentNodes,...divNodes,ceoNode,BRAIN];
  drawOrder.forEach(n=>{
    const p=w2s(n.x,n.y);
    const r=n.radius*camZ;
    const isSel=selectedNode&&selectedNode.id===n.id;
    const isHov=hoveredNode&&hoveredNode.id===n.id;
    const isConn=selectedNode&&LINKS.some(l=>(l.source===selectedNode.id&&l.target===n.id)||(l.target===selectedNode.id&&l.source===n.id));
    const isDim=selectedNode&&!isSel&&!isConn;

    // Brain breathing
    if(n.type==='brain'){
      const b1=Math.sin(tick*.02)*.3+.7;
      const b2=Math.sin(tick*.015+1)*.2+.5;
      ctx.beginPath();ctx.arc(p.x,p.y,r+10*b1*camZ,0,Math.PI*2);
      ctx.strokeStyle='#D4A853'+Math.round(b1*30).toString(16).padStart(2,'0');
      ctx.lineWidth=1.5*camZ;ctx.stroke();
      ctx.beginPath();ctx.arc(p.x,p.y,r+22*b2*camZ,0,Math.PI*2);
      ctx.strokeStyle='#D4A853'+Math.round(b2*18).toString(16).padStart(2,'0');
      ctx.lineWidth=1*camZ;ctx.stroke();
    }

    // Glow
    if(isSel||isHov||n.type==='brain'){
      const gr=n.type==='brain'?r*3.5:r*2.5;
      const glow=ctx.createRadialGradient(p.x,p.y,r*.3,p.x,p.y,gr);
      glow.addColorStop(0,(n.color||'#D4A853')+(isSel||isHov?'45':'18'));
      glow.addColorStop(1,(n.color||'#D4A853')+'00');
      ctx.fillStyle=glow;ctx.beginPath();ctx.arc(p.x,p.y,gr,0,Math.PI*2);ctx.fill();
    }

    // Selection ring
    if(isSel){
      const pr=r+(Math.sin(tick*.05)*3+5)*camZ;
      ctx.beginPath();ctx.arc(p.x,p.y,pr,0,Math.PI*2);
      ctx.strokeStyle=(n.color||'#D4A853')+'40';ctx.lineWidth=1.5*camZ;ctx.stroke();
    }

    // Node body
    ctx.globalAlpha=isDim?.18:1;
    ctx.beginPath();ctx.arc(p.x,p.y,r,0,Math.PI*2);
    const col=n.color||'#D4A853';
    const grad=ctx.createRadialGradient(p.x-r*.25,p.y-r*.25,0,p.x,p.y,r);
    if(n.type==='brain'){grad.addColorStop(0,'#E8BE6A');grad.addColorStop(1,'#B8862D');}
    else if(n.type==='div'){grad.addColorStop(0,col+'DD');grad.addColorStop(1,col+'88');}
    else{grad.addColorStop(0,col);grad.addColorStop(1,col+'BB');}
    ctx.fillStyle=grad;ctx.fill();

    // Border
    ctx.strokeStyle=isSel?'#FFFFFF':col;
    ctx.lineWidth=(isSel?2:(n.type==='brain'?1.5:1))*camZ;ctx.stroke();

    // Lead indicator ring
    if(n.lead&&n.type==='agent'&&!isDim){
      ctx.beginPath();ctx.arc(p.x,p.y,r+3*camZ,0,Math.PI*2);
      ctx.strokeStyle='#D4A85355';ctx.lineWidth=1*camZ;ctx.stroke();
    }

    // Emoji / Logo
    if(n.type==='brain' && logoLoaded){
      const logoSize=r*1.4;
      ctx.save();ctx.beginPath();ctx.arc(p.x,p.y,r*.85,0,Math.PI*2);ctx.clip();
      ctx.drawImage(logoImg,p.x-logoSize,p.y-logoSize,logoSize*2,logoSize*2);
      ctx.restore();
    } else {
      const es=n.type==='brain'?22:(n.type==='div'?14:(n.lead?12:10));
      ctx.font=`${Math.max(8,es*camZ)}px system-ui`;
      ctx.textAlign='center';ctx.textBaseline='middle';
      ctx.fillText(n.emoji,p.x,p.y+1);
    }

    // Label
    if(camZ>.35){
      const ls=n.type==='brain'?11:(n.type==='div'?9:(n.lead?8.5:7.5));
      ctx.font=`${n.type==='brain'||n.lead?700:500} ${Math.max(6,ls*camZ)}px system-ui`;
      ctx.fillStyle=isDim?'#FFFFFF18':'#FFFFFFCC';
      ctx.textBaseline='top';
      ctx.fillText(n.name,p.x,p.y+r+4*camZ);
      // Division agent count
      if(n.type==='div'&&camZ>.55){
        const cnt=AGENTS.filter(a=>a.div===n.divKey&&a.id!=='ceo').length;
        ctx.font=`600 ${Math.max(5,6.5*camZ)}px system-ui`;
        ctx.fillStyle=isDim?'#FFFFFF10':col+'77';
        ctx.fillText(cnt+' agents',p.x,p.y+r+4*camZ+Math.max(8,11*camZ));
      }
    }
    ctx.globalAlpha=1;
  });

  requestAnimationFrame(draw);
}

// ─── Interaction ───
function getNodeAt(sx,sy){
  const w=s2w(sx,sy);
  const check=[BRAIN,ceoNode,...divNodes,...agentNodes];
  for(const n of check){
    const dx=w.x-n.x,dy=w.y-n.y;
    if(dx*dx+dy*dy<(n.radius+6)*(n.radius+6))return n;
  }
  return null;
}

canvas.addEventListener('mousedown',e=>{if(!getNodeAt(e.clientX,e.clientY)){dragging=true;dragStart={x:e.clientX,y:e.clientY};camStart={x:camX,y:camY};}});
canvas.addEventListener('mousemove',e=>{
  if(dragging){camX=camStart.x-(e.clientX-dragStart.x)/camZ;camY=camStart.y-(e.clientY-dragStart.y)/camZ;return;}
  hoveredNode=getNodeAt(e.clientX,e.clientY);canvas.classList.toggle('hovering',!!hoveredNode);
});
canvas.addEventListener('mouseup',()=>{dragging=false});
canvas.addEventListener('mouseleave',()=>{dragging=false;hoveredNode=null});
canvas.addEventListener('click',e=>{
  const n=getNodeAt(e.clientX,e.clientY);
  if(n){selectedNode=n;openPanel(n);document.getElementById('instruction').classList.add('hidden');}
  else if(!dragging)closePanel();
});
canvas.addEventListener('wheel',e=>{
  e.preventDefault();
  const zf=e.deltaY>0?.9:1.1;const nz=Math.max(.25,Math.min(3,camZ*zf));
  const w=s2w(e.clientX,e.clientY);camZ=nz;
  camX=w.x-(e.clientX-W/2)/camZ;camY=w.y-(e.clientY-H/2)/camZ;
},{passive:false});

// Touch
let lastTD=0;
canvas.addEventListener('touchstart',e=>{
  if(e.touches.length===1){const t=e.touches[0];const n=getNodeAt(t.clientX,t.clientY);
    if(n){selectedNode=n;openPanel(n);document.getElementById('instruction').classList.add('hidden');return;}
    dragging=true;dragStart={x:t.clientX,y:t.clientY};camStart={x:camX,y:camY};
  }else if(e.touches.length===2){const dx=e.touches[1].clientX-e.touches[0].clientX,dy=e.touches[1].clientY-e.touches[0].clientY;lastTD=Math.sqrt(dx*dx+dy*dy);}
});
canvas.addEventListener('touchmove',e=>{e.preventDefault();
  if(e.touches.length===1&&dragging){const t=e.touches[0];camX=camStart.x-(t.clientX-dragStart.x)/camZ;camY=camStart.y-(t.clientY-dragStart.y)/camZ;}
  else if(e.touches.length===2){const dx=e.touches[1].clientX-e.touches[0].clientX,dy=e.touches[1].clientY-e.touches[0].clientY;const d=Math.sqrt(dx*dx+dy*dy);if(lastTD)camZ=Math.max(.25,Math.min(3,camZ*(d/lastTD)));lastTD=d;}
},{passive:false});
canvas.addEventListener('touchend',()=>{dragging=false;lastTD=0});

// ─── Panel ───
function openPanel(node){
  if(node.type==='brain'){document.getElementById('pEmoji').innerHTML='<img src="logo_dark.png" style="width:48px;height:48px;border-radius:8px">';}
  else{document.getElementById('pEmoji').textContent=node.emoji;}
  document.getElementById('pName').textContent=node.name;
  document.getElementById('pRole').textContent=node.role||'';

  const badges=document.getElementById('pBadges');
  let badgeHtml='';
  if(node.type==='brain'){
    badgeHtml='<span class="pbadge" style="background:#D4A85320;color:#D4A853;border:1px solid #D4A853">Company Brain</span>';
  }else if(node.type==='div'){
    badgeHtml='<span class="pbadge" style="background:'+node.color+'20;color:'+node.color+';border:1px solid '+node.color+'">'+node.name+'</span>';
  }else{
    const divCol=node.div==='executive'?'#D4A853':DIVS[node.div]?.color||'#666';
    const divLabel=node.div==='executive'?'Executive':DIVS[node.div]?.label||'';
    badgeHtml='<span class="pbadge" style="background:'+divCol+'20;color:'+divCol+';border:1px solid '+divCol+'40">'+divLabel+'</span>';
    if(node.lead) badgeHtml+='<span class="pbadge lead">Division Lead</span>';
  }
  badges.innerHTML=badgeHtml;

  let html='';

  if(node.type==='brain'){
    // Brain panel
    html+='<div class="sec"><div class="sec-title">Divisions</div>';
    divNodes.forEach(d=>{
      const agents=AGENTS.filter(a=>a.div===d.divKey&&a.id!=='ceo');
      html+='<div class="agent-card" onclick="selectById(\''+d.id+'\')">';
      html+='<div class="ac-emoji">'+d.emoji+'</div><div class="ac-info">';
      html+='<div class="ac-name" style="color:'+d.color+'">'+d.name+'</div>';
      html+='<div class="ac-role">'+agents.length+' agents — '+d.role+'</div></div></div>';
    });
    html+='</div>';

    html+='<div class="sec"><div class="sec-title">Production Pipeline</div>';
    html+='<div class="human-box" style="font-size:.62rem;line-height:1.7;border-left-color:var(--gold)">Viral Intel → Content Package → QA (CVI ≥ 70) → Gemini → FFmpeg → QC Inspection → CEO Approval → Scheduler → Post</div></div>';

    html+='<div class="sec"><div class="sec-title">🧠 Living Intelligence</div>';
    html+='<div class="human-box" style="border-left-color:var(--growth)">This is not a static system. The brain continuously absorbs knowledge — every reel\'s performance, every CEO decision, every viral trend, every QC rejection — and feeds learnings back. Each cycle makes the next one smarter.</div></div>';

    html+='<div class="sec"><div class="sec-title">Knowledge Loops</div><div class="skills">';
    ['Analytics → Creative (what works)','CVI predicted vs actual (recalibration)','CEO rejections → Content (what to avoid)','DVRI → Viral → Creative (trends)','Comments → Community → Creative (audience wants)','QC metrics → Analytics (quality tracking)'].forEach(s=>{
      html+='<div class="skill-pill">'+s+'</div>';
    });
    html+='</div></div>';

    html+='<div class="sec"><div class="sec-title">Operating Rhythm</div><div class="skills">';
    ['2 reels/day (7AM + 7PM IST)','CVI ≥ 70 gate','7-day buffer target','Sunday batch sprint','Morning standup','Nightly scratchpad review'].forEach(s=>{
      html+='<div class="skill-pill">'+s+'</div>';
    });
    html+='</div></div>';

  } else if(node.type==='div'){
    // Division panel
    const agents=AGENTS.filter(a=>a.div===node.divKey&&a.id!=='ceo');
    const lead=agents.find(a=>a.lead);

    html+='<div class="sec"><div class="sec-title">Agents</div>';
    agents.forEach(a=>{
      html+='<div class="agent-card" onclick="selectById(\''+a.id+'\')">';
      html+='<div class="ac-emoji">'+a.emoji+'</div><div class="ac-info">';
      html+='<div class="ac-name">'+a.name+(a.lead?' <span class="ac-lead">Lead</span>':'')+'</div>';
      html+='<div class="ac-role">'+a.role+'</div></div></div>';
    });
    html+='</div>';

    html+='<div class="sec"><div class="sec-title">Human Cost Replaced</div>';
    agents.forEach(a=>{
      html+='<div class="cost-box" style="margin-bottom:.3rem"><span class="cost-role">'+a.replaces.role+'</span><span class="cost-val">'+a.replaces.cost+'</span></div>';
    });
    html+='</div>';

  } else {
    // Agent panel
    html+='<div class="sec"><div class="sec-title">Replaces</div>';
    html+='<div class="cost-box"><span class="cost-role">'+node.replaces.role+'</span><span class="cost-val">'+node.replaces.cost+'</span></div></div>';

    html+='<div class="sec"><div class="sec-title">Automation Ladder</div><div class="ladder">';
    node.ladder.forEach(l=>{
      html+='<div class="ladder-step'+(l.current?' current':'')+'">';
      html+='<div class="ladder-marker"></div><div class="ladder-info">';
      html+='<div class="ladder-level">'+l.level+'</div>';
      html+='<div class="ladder-desc">'+l.desc+'</div></div></div>';
    });
    html+='</div></div>';

    if(node.feedsInto&&node.feedsInto.length){
      html+='<div class="sec"><div class="sec-title">Feeds Into</div><div class="tags">';
      node.feedsInto.forEach(id=>{const t=nodeMap[id];if(t)html+='<div class="tag" onclick="selectById(\''+id+'\')" style="border-color:'+(t.color||'#666')+'40;color:'+(t.color||'#999')+'">'+t.emoji+' '+t.name+'</div>';});
      html+='</div></div>';
    }
    if(node.feedsFrom&&node.feedsFrom.length){
      html+='<div class="sec"><div class="sec-title">Receives From</div><div class="tags">';
      node.feedsFrom.forEach(id=>{const t=nodeMap[id];if(t)html+='<div class="tag" onclick="selectById(\''+id+'\')" style="border-color:'+(t.color||'#666')+'40;color:'+(t.color||'#999')+'">'+t.emoji+' '+t.name+'</div>';});
      html+='</div></div>';
    }

    html+='<div class="sec"><div class="sec-title">The Human</div>';
    html+='<div class="human-box">'+node.human+'</div></div>';

    html+='<div class="sec"><div class="sec-title">Skills</div><div class="skills">';
    node.skills.forEach(s=>{html+='<div class="skill-pill">'+s+'</div>';});
    html+='</div></div>';
  }

  document.getElementById('pBody').innerHTML=html;
  document.getElementById('panel').classList.add('open');
}

function closePanel(){document.getElementById('panel').classList.remove('open');selectedNode=null;}
function selectById(id){const n=nodeMap[id];if(n){selectedNode=n;openPanel(n);}}

// ─── Legend ───
(function(){
  const el=document.getElementById('legend');
  el.innerHTML='<div class="legend-item" onclick="animTo(0,-45,1.2)"><div class="legend-dot" style="background:#D4A853;box-shadow:0 0 6px #D4A853"></div><div class="legend-label">Executive</div></div>'+
  Object.entries(DIVS).map(([k,d])=>
    '<div class="legend-item" onclick="focusDiv(\''+k+'\')"><div class="legend-dot" style="background:'+d.color+';box-shadow:0 0 4px '+d.color+'"></div><div class="legend-label">'+d.label+'</div></div>'
  ).join('');
})();

function animTo(tx,ty,tz){
  const sx=camX,sy=camY,sz=camZ;let t=0;
  (function step(){t+=.03;if(t>1)t=1;const e=1-Math.pow(1-t,3);
    camX=sx+(tx-sx)*e;camY=sy+(ty-sy)*e;camZ=sz+(tz-sz)*e;
    if(t<1)requestAnimationFrame(step);
  })();
}
function focusDiv(k){const d=divNodes.find(n=>n.divKey===k);if(d)animTo(d.x,d.y,1.6);}

setTimeout(()=>document.getElementById('instruction').classList.add('hidden'),4000);
draw();
</script>
